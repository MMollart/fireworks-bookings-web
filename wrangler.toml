name = "fireworks-bookings-web"
main = "src/server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fireworks_bookings_d1"
database_id = "your-d1-database-id-here"

[vars]
NODE_ENV = "production"
APP_NAME = "Fireworks Bookings"
SESSION_COOKIE_NAME = "fb_session"
