<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Lydiard Park Fireworks</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/fireworks-badge.png">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <img class="login-brand-badge" src="/images/fireworks-badge.png" alt="Lydiard Fireworks">
      <h1 class="login-title">Lydiard Park Fireworks</h1>
      <p class="login-subtitle">Bookings and Check-In</p>
    </div>

    <form id="loginForm" class="login-form">
      <div id="loginAlert" class="login-alert" role="alert"></div>

      <div class="form-group">
        <label for="usernameInput" class="form-label">Username</label>
        <input 
          type="text" 
          id="usernameInput" 
          name="username" 
          class="form-control" 
          placeholder="Enter your username" 
          required 
          autocomplete="username" 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <input 
          type="password" 
          id="passwordInput" 
          name="password" 
          class="form-control" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.65rem; font-size: 0.9375rem; margin-top: 0.5rem;">
        Sign In
      </button>

      <div class="security-notice">
        <strong>Approved Access Only</strong><br>
        This portal is restricted to authorized volunteers and administrators. There is no public registration; accounts are created exclusively by system administrators.
      </div>
    </form>
    <div class="login-footer">
      <img class="login-scouts-logo" src="/images/scouts-purple-linear.png" alt="Swindon Scouts">
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
