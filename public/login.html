<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Fireworks Bookings</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎆</text></svg>">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-badge">🎆</div>
      <h1 class="login-title">Fireworks Bookings</h1>
      <p class="login-subtitle">Scout Group Event Management Portal</p>
    </div>

    <form id="loginForm" class="login-form">
      <div id="loginAlert" class="login-alert" role="alert"></div>

      <div class="form-group">
        <label for="usernameInput" class="form-label">Username</label>
        <input 
          type="text" 
          id="usernameInput" 
          name="username" 
          class="form-control" 
          placeholder="Enter your username" 
          required 
          autocomplete="username" 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <input 
          type="password" 
          id="passwordInput" 
          name="password" 
          class="form-control" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.65rem; font-size: 0.9375rem; margin-top: 0.5rem;">
        Sign In
      </button>

      <div class="security-notice">
        <strong>🔒 Approved Access Only</strong><br>
        This portal is restricted to authorized volunteers and administrators. There is no public registration; accounts are created exclusively by system administrators.
      </div>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
